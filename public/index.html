<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WebSocket Message Client</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				padding: 20px;
			}

			.container {
				background: white;
				border-radius: 20px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
				width: 100%;
				max-width: 800px;
				height: 90vh;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}

			.header {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				padding: 20px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.header h1 {
				font-size: 24px;
				font-weight: 600;
			}

			.status {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 14px;
			}

			.status-indicator {
				width: 12px;
				height: 12px;
				border-radius: 50%;
				background: #4ade80;
				animation: pulse 2s infinite;
			}

			.status-indicator.disconnected {
				background: #ef4444;
				animation: none;
			}

			.status-indicator.connecting {
				background: #fbbf24;
				animation: pulse 1s infinite;
			}

			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.5;
				}
			}

			.messages-container {
				flex: 1;
				overflow-y: auto;
				padding: 20px;
				background: #f8fafc;
			}

			.message {
				margin-bottom: 20px;
				animation: slideIn 0.3s ease-out;
				display: flex;
				flex-direction: column;
			}

			.message.sent {
				align-items: flex-end;
			}

			.message.received {
				align-items: flex-start;
			}

			@keyframes slideIn {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.message-header {
				display: flex;
				justify-content: flex-start;
				align-items: center;
				margin-bottom: 6px;
				font-size: 11px;
				color: #94a3b8;
				font-weight: 500;
				padding: 0 4px;
			}

			.message-footer {
				display: flex;
				justify-content: flex-end;
				align-items: center;
				margin-top: 4px;
				font-size: 10px;
				color: #94a3b8;
				font-weight: 400;
				padding: 0 4px;
			}

			.message-content {
				background: white;
				padding: 14px 18px;
				border-radius: 18px;
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.08);
				word-wrap: break-word;
				line-height: 1.5;
				font-size: 15px;
				max-width: 75%;
				min-width: 120px;
				position: relative;
			}

			.message.sent .message-content {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border-bottom-right-radius: 4px;
			}

			.message.received .message-content {
				background: #ffffff;
				color: #1e293b;
				border-bottom-left-radius: 4px;
				border: 1px solid #e2e8f0;
			}

			.message.agent .message-content {
				background: #f8fafc;
				color: #0f172a;
				border: 1px solid #e2e8f0;
				border-left: 4px solid #3b82f6;
			}

			.message.tool .message-content {
				background: #fffbeb;
				color: #78350f;
				border: 1px solid #fde68a;
				border-left: 4px solid #f59e0b;
				font-style: italic;
			}

			.message details {
				cursor: pointer;
				margin-top: 6px;
				font-size: 10px;
				opacity: 0;
				transition: opacity 0.2s;
			}

			.message:hover details {
				opacity: 0.6;
			}

			.message details:hover {
				opacity: 1;
			}

			.message details summary {
				user-select: none;
				color: #94a3b8;
				font-weight: 500;
				cursor: pointer;
			}

			.message details summary:hover {
				color: #64748b;
			}

			.message-data {
				font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Roboto Mono', monospace;
				font-size: 10px;
				background: #f8fafc;
				padding: 10px;
				border-radius: 8px;
				margin-top: 8px;
				overflow-x: auto;
				white-space: pre-wrap;
				word-break: break-all;
				border: 1px solid #e2e8f0;
				color: #475569;
			}

			.message.sent .message-data {
				background: rgba(255, 255, 255, 0.15);
				border-color: rgba(255, 255, 255, 0.2);
				color: rgba(255, 255, 255, 0.9);
			}

			.input-container {
				padding: 20px;
				background: white;
				border-top: 1px solid #e2e8f0;
				display: flex;
				gap: 12px;
			}

			.input-container input {
				flex: 1;
				padding: 12px 16px;
				border: 2px solid #e2e8f0;
				border-radius: 12px;
				font-size: 14px;
				outline: none;
				transition: border-color 0.2s;
			}

			.input-container input:focus {
				border-color: #667eea;
			}

			.input-container button {
				padding: 12px 24px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				border-radius: 12px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				transition: transform 0.2s, box-shadow 0.2s;
			}

			.input-container button:hover {
				transform: translateY(-2px);
				box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
			}

			.input-container button:active {
				transform: translateY(0);
			}

			.input-container button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
				transform: none;
			}

			.restart-container {
				padding: 20px;
				background: white;
				border-top: 1px solid #e2e8f0;
				display: none;
				justify-content: center;
				align-items: center;
			}

			.restart-container.active {
				display: flex;
			}

			.restart-container button {
				padding: 12px 32px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				border-radius: 12px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				transition: transform 0.2s, box-shadow 0.2s;
			}

			.restart-container button:hover {
				transform: translateY(-2px);
				box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
			}

			.restart-container button:active {
				transform: translateY(0);
			}

			.empty-state {
				text-align: center;
				color: #94a3b8;
				padding: 40px;
				font-size: 16px;
			}

			.event-badge {
				display: inline-block;
				background: #e0e7ff;
				color: #4338ca;
				padding: 2px 8px;
				border-radius: 4px;
				font-size: 11px;
				font-weight: 600;
				margin-right: 8px;
			}

			.card-selection {
				flex: 1;
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 30px;
				padding: 40px;
			}

			.service-card {
				background: white;
				border: 2px solid #e2e8f0;
				border-radius: 16px;
				padding: 40px;
				width: 280px;
				cursor: pointer;
				transition: all 0.3s ease;
				text-align: center;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			.service-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
				border-color: #667eea;
			}

			.service-card:active {
				transform: translateY(-2px);
			}

			.service-card.loading {
				opacity: 0.6;
				cursor: not-allowed;
				pointer-events: none;
			}

			.service-icon {
				font-size: 48px;
				margin-bottom: 16px;
			}

			.service-card h2 {
				font-size: 24px;
				font-weight: 600;
				color: #1e293b;
				margin-bottom: 8px;
			}

			.service-card p {
				font-size: 14px;
				color: #64748b;
			}

			.chat-interface {
				display: none;
				flex-direction: column;
				flex: 1;
				overflow: hidden;
			}

			.chat-interface.active {
				display: flex;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>WebSocket Message Client</h1>
				<div class="status">
					<div class="status-indicator" id="statusIndicator"></div>
					<span id="statusText">Not Connected</span>
				</div>
			</div>

			<!-- Card Selection Screen -->
			<div class="card-selection" id="cardSelection">
				<div class="service-card" id="voiceCard" data-service-type="websocket">
					<div class="service-icon">🎤</div>
					<h2>Voice</h2>
					<p>Start a voice conversation with Web AI</p>
				</div>
				<div class="service-card" id="chatCard" data-service-type="message">
					<div class="service-icon">💬</div>
					<h2>Chat</h2>
					<p>Start a text conversation with Web AI</p>
				</div>
			</div>

			<!-- Chat Interface -->
			<div class="chat-interface" id="chatInterface">
				<div class="messages-container" id="messagesContainer">
					<div class="empty-state" id="emptyState">No messages yet. Start a conversation!</div>
				</div>

				<div class="input-container" id="inputContainer">
					<input type="text" id="messageInput" placeholder="Type your message here..." disabled />
					<button id="sendButton" disabled>Send</button>
				</div>

				<div class="restart-container" id="restartContainer">
					<button id="restartButton">Restart Conversation</button>
				</div>
			</div>
		</div>

		<script>
			const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
			const wsHost = window.location.host;
			let ws = null;

			const statusIndicator = document.getElementById('statusIndicator');
			const statusText = document.getElementById('statusText');
			const messagesContainer = document.getElementById('messagesContainer');
			const messageInput = document.getElementById('messageInput');
			const sendButton = document.getElementById('sendButton');
			const emptyState = document.getElementById('emptyState');
			const cardSelection = document.getElementById('cardSelection');
			const chatInterface = document.getElementById('chatInterface');
			const voiceCard = document.getElementById('voiceCard');
			const chatCard = document.getElementById('chatCard');
			const inputContainer = document.getElementById('inputContainer');
			const restartContainer = document.getElementById('restartContainer');
			const restartButton = document.getElementById('restartButton');

			let messageCount = 0;
			let mongoCallId = null;
			let callId = null;
			let serviceType = null;
			// Track displayed messages to prevent duplicates
			const displayedMessages = new Set();

			// API payload configuration
			const API_CONFIG = {
				contextForAi: 'Conversation with Web AI',
				languageCode: 'el-GR',
				agentId: '692856a776bb85eee1ee8767',
				// agentId: '68d938359e704cab89d0bf7b',
				associateId: '',
				codec: 'PCM16',
			};

			// Initialize WebSocket connection
			function initWebSocket() {
				// Close existing connection if any
				if (ws) {
					if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
						ws.close();
					}
					ws = null;
				}

				ws = new WebSocket(`${wsProtocol}//${wsHost}`);
				setupWebSocketHandlers();
			}

			// Setup WebSocket event handlers
			function setupWebSocketHandlers() {
				if (!ws) return;

				ws.onopen = () => {
					updateStatus('connected', 'Connected');
					messageInput.disabled = false;
					sendButton.disabled = false;
					messageInput.focus();
					addSystemMessage('Connected to WebSocket server');
				};

				ws.onclose = () => {
					updateStatus('disconnected', 'Disconnected');
					messageInput.disabled = true;
					sendButton.disabled = true;
					addSystemMessage('Disconnected from WebSocket server');
				};

				ws.onerror = (error) => {
					updateStatus('disconnected', 'Error');
					addSystemMessage('WebSocket error occurred', 'error');
					console.error('WebSocket error:', error);
				};

				ws.onmessage = (event) => {
					try {
						const data = JSON.parse(event.data);
						console.log('Received message:', data);

						// Handle callMongoId from server
						if (data.type === 'callMongoId') {
							mongoCallId = data.callMongoId;
							callId = data.callId;
							console.log('Received callMongoId:', mongoCallId);
							return;
						}

						// Handle error messages
						if (data.type === 'error') {
							addSystemMessage(data.message || 'An error occurred', 'error');
							return;
						}

						// Handle single message from websocket-{callMongoId} events
						if (data.event && data.data) {
							console.log('data', data);
							// Check if data.data is a message object that should be displayed
							if (data.data.type === 'message' && data.data.content) {
								// Check for duplicates before displaying
								const uniqueId = getMessageId(data.data);
								if (displayedMessages.has(uniqueId)) {
									console.log('Skipping duplicate message');
									return;
								}
								displayedMessages.add(uniqueId);

								// Display as a proper message with role-based styling
								const msg = data.data;
								const role = msg.role || 'Unknown';
								const content = msg.content || '';
								const timestamp = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();

								let messageType = 'received';
								let roleLabel = role;

								if (role === 'Associate') {
									messageType = 'sent';
									roleLabel = 'You';
								} else if (role === 'Agent') {
									roleLabel = 'Agent';
								} else if (role === 'Tool') {
									roleLabel = 'System';
								}

								// Display single message
								addMessageWithRole(content, messageType, roleLabel, timestamp, '', msg);
								return; // Exit early after processing message
							} else if (data.data.type) {
								// Handle other event types (disconnect, etc.) - display professionally
								const eventType = data.data.type;
								let eventMessage = '';
								let messageType = 'info';

								if (eventType === 'disconnect') {
									eventMessage = 'Call disconnected';
									messageType = 'warning';
									// Hide input container and show restart button
									inputContainer.style.display = 'none';
									restartContainer.classList.add('active');
									messageInput.disabled = true;
									sendButton.disabled = true;
								} else if (eventType === 'connect') {
									eventMessage = 'Call connected';
									messageType = 'info';
								} else {
									// For other event types, show a clean message
									eventMessage = `${eventType.charAt(0).toUpperCase() + eventType.slice(1)} event`;
									messageType = 'info';
								}

								// Display as a professional system message
								addSystemMessage(eventMessage, messageType);
								return;
							} else {
								// Fallback: display as raw data (for debugging)
								addMessage(`Event: ${data.event}`, JSON.stringify(data.data, null, 2), 'received', data.callId ? `Call ID: ${data.callId}` : undefined);
							}
						} else if (data.messages && Array.isArray(data.messages)) {
							// Handle messages array if it comes directly (backward compatibility)
							displayMessagesArray(data.messages);
						} else if (data.message) {
							// Simple text message
							addMessage(data.message, null, 'received');
						} else {
							// Raw data
							addMessage('Received data', JSON.stringify(data, null, 2), 'received');
						}
					} catch (error) {
						// If not JSON, treat as plain text
						addMessage('Received message', event.data, 'received');
					}
				};
			}

			// Call initiate-websocket-call API
			async function initiateCall(serviceTypeValue) {
				try {
					// Show loading state
					voiceCard.classList.add('loading');
					chatCard.classList.add('loading');
					updateStatus('connecting', 'Connecting...');

					const payload = {
						...API_CONFIG,
						serviceType: serviceTypeValue,
					};

					console.log('Calling API with payload:', payload);

					const response = await fetch('/initiate-websocket-call', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
						},
						body: JSON.stringify(payload),
					});

					if (!response.ok) {
						const errorData = await response.json();
						throw new Error(errorData.error || 'Failed to initiate call');
					}

					const data = await response.json();
					console.log('API Response:', data);

					// Store response data - use the new callMongoId from API response
					const newCallMongoId = data.callMongoId || data.mongoCallId || data.mongoId || data._id;
					const newCallId = data.callId || data.id || data.connectionId;

					// Update call IDs with new values
					mongoCallId = newCallMongoId;
					callId = newCallId;
					serviceType = serviceTypeValue;

					console.log('Updated callMongoId:', mongoCallId, 'callId:', callId);

					// Hide card selection and show chat interface
					cardSelection.style.display = 'none';
					chatInterface.classList.add('active');

					// Show input container and hide restart button
					inputContainer.style.display = 'flex';
					restartContainer.classList.remove('active');

					// Initialize WebSocket connection if not already connected
					if (!ws || ws.readyState !== WebSocket.OPEN) {
						initWebSocket();
					}

					// Show success message
					addSystemMessage(`Successfully started ${serviceTypeValue === 'websocket' ? 'Voice' : 'Chat'} conversation`);
					updateStatus('connected', 'Connected');
				} catch (error) {
					console.error('Error initiating call:', error);
					updateStatus('disconnected', 'Error');
					addSystemMessage(`Failed to start conversation: ${error.message}`, 'error');
					voiceCard.classList.remove('loading');
					chatCard.classList.remove('loading');
				}
			}

			// Restart conversation
			async function restartConversation() {
				try {
					// Clear all messages
					messagesContainer.innerHTML = '<div class="empty-state" id="emptyState">No messages yet. Start a conversation!</div>';
					// Re-reference emptyState after clearing
					const emptyStateEl = document.getElementById('emptyState');
					if (emptyStateEl) {
						emptyStateEl.style.display = 'block';
					}

					// Clear displayed messages tracking
					displayedMessages.clear();
					messageCount = 0;

					// Reset call IDs
					mongoCallId = null;
					callId = null;

					// Close existing WebSocket connection if any
					if (ws) {
						ws.close();
						ws = null;
					}

					// Hide restart button and show input container
					restartContainer.classList.remove('active');
					inputContainer.style.display = 'flex';

					// Re-initiate call with stored serviceType
					if (serviceType) {
						await initiateCall(serviceType);
					} else {
						// If no serviceType stored, go back to card selection
						cardSelection.style.display = 'flex';
						chatInterface.classList.remove('active');
						restartContainer.classList.remove('active');
						inputContainer.style.display = 'flex';
					}
				} catch (error) {
					console.error('Error restarting conversation:', error);
					// Re-reference emptyState for error message
					const emptyStateEl = document.getElementById('emptyState');
					if (emptyStateEl) {
						emptyStateEl.style.display = 'none';
					}
					addSystemMessage(`Failed to restart conversation: ${error.message}`, 'error');
				}
			}

			// Attach restart button click handler
			restartButton.addEventListener('click', restartConversation);

			// Send message (sends as call-data to third-party socket)
			function sendMessage() {
				const message = messageInput.value.trim();
				if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

				// Create call data payload with the text message
				// Include callMongoId if available to ensure server uses the correct one
				const callData = {
					text: message,
					timestamp: new Date().toISOString(),
				};

				// Include callMongoId if we have it (helps server route correctly)
				if (mongoCallId) {
					callData.callMongoId = mongoCallId;
				}

				ws.send(JSON.stringify(callData));
				messageInput.value = '';
			}

			function getMessageId(msg) {
				// Stable ID independent of timestamp
				return `${msg.role || ''}::${msg.content || ''}`.trim();
			}

			function displayMessagesArray(messages) {
				if (!Array.isArray(messages)) return;

				messages.forEach((msg) => {
					// Filter: only show messages for current call mongo id
					if (mongoCallId) {
						const msgCallMongoId = msg.callMongoId || msg.callId;
						if (msgCallMongoId && msgCallMongoId !== mongoCallId) {
							return; // Skip messages from other calls
						}
					}

					const uniqueId = getMessageId(msg);

					// Skip duplicates
					if (displayedMessages.has(uniqueId)) return;
					displayedMessages.add(uniqueId);

					const role = msg.role || 'Unknown';
					const content = msg.content || '';
					const timestamp = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();

					let messageType = 'received';
					let roleLabel = role;

					if (role === 'Associate') {
						messageType = 'sent';
						roleLabel = 'You';
					} else if (role === 'Agent') {
						roleLabel = 'Agent';
					} else if (role === 'Tool') {
						roleLabel = 'System';
					}

					// No additional info needed - display message directly
					addMessageWithRole(content, messageType, roleLabel, timestamp, '', msg);
				});
			}

			// Add message with role information
			function addMessageWithRole(text, type, metadata, timestamp, additionalInfo, fullMessage) {
				emptyState.style.display = 'none';
				messageCount++;

				const messageDiv = document.createElement('div');
				// Add role-based class if available
				const role = fullMessage?.role?.toLowerCase() || '';
				let className = `message ${type}`;
				if (role === 'agent') {
					className += ' agent';
				} else if (role === 'tool') {
					className += ' tool';
				}
				messageDiv.className = className;

				// Create message wrapper for better alignment
				const messageWrapper = document.createElement('div');
				messageWrapper.style.display = 'flex';
				messageWrapper.style.flexDirection = 'column';
				messageWrapper.style.maxWidth = '75%';

				const header = document.createElement('div');
				header.className = 'message-header';

				const senderInfo = document.createElement('span');
				senderInfo.style.fontWeight = '600';
				senderInfo.style.color = type === 'sent' ? '#667eea' : '#64748b';
				senderInfo.textContent = metadata || (type === 'sent' ? 'You' : 'Server');

				header.appendChild(senderInfo);

				const content = document.createElement('div');
				content.className = 'message-content';
				content.textContent = text;

				const footer = document.createElement('div');
				footer.className = 'message-footer';
				const timeInfo = document.createElement('span');
				timeInfo.textContent = timestamp;
				footer.appendChild(timeInfo);

				messageWrapper.appendChild(header);
				messageWrapper.appendChild(content);
				messageWrapper.appendChild(footer);

				messageDiv.appendChild(messageWrapper);
				messagesContainer.appendChild(messageDiv);
				messagesContainer.scrollTop = messagesContainer.scrollHeight;
			}

			// Add message to UI
			function addMessage(text, data, type, metadata) {
				emptyState.style.display = 'none';
				messageCount++;

				const messageDiv = document.createElement('div');
				messageDiv.className = `message ${type}`;

				const header = document.createElement('div');
				header.className = 'message-header';

				const eventInfo = document.createElement('span');
				if (metadata) {
					eventInfo.textContent = metadata;
				} else {
					eventInfo.textContent = type === 'sent' ? 'You' : 'Server';
				}

				const timeInfo = document.createElement('span');
				timeInfo.textContent = new Date().toLocaleTimeString();

				header.appendChild(eventInfo);
				header.appendChild(timeInfo);

				const content = document.createElement('div');
				content.className = 'message-content';
				content.textContent = text;

				messageDiv.appendChild(header);
				messageDiv.appendChild(content);

				if (data) {
					const dataDiv = document.createElement('div');
					dataDiv.className = 'message-data';
					dataDiv.textContent = data;
					messageDiv.appendChild(dataDiv);
				}

				messagesContainer.appendChild(messageDiv);
				messagesContainer.scrollTop = messagesContainer.scrollHeight;
			}

			// Add system message
			function addSystemMessage(text, type = 'info', metadata = null) {
				const messageDiv = document.createElement('div');
				messageDiv.className = 'message received';
				messageDiv.style.opacity = '0.9';
				messageDiv.style.alignItems = 'center';

				const messageWrapper = document.createElement('div');
				messageWrapper.style.display = 'flex';
				messageWrapper.style.flexDirection = 'column';
				messageWrapper.style.width = '100%';
				messageWrapper.style.maxWidth = '100%';

				const header = document.createElement('div');
				header.className = 'message-header';
				header.style.justifyContent = 'center';
				header.style.marginBottom = '6px';

				const senderInfo = document.createElement('span');
				senderInfo.style.fontWeight = '600';
				senderInfo.style.color = '#64748b';
				senderInfo.textContent = metadata || 'System';

				const timeInfo = document.createElement('span');
				timeInfo.textContent = new Date().toLocaleTimeString();
				timeInfo.style.fontWeight = '400';

				header.appendChild(senderInfo);
				header.appendChild(document.createTextNode(' • '));
				header.appendChild(timeInfo);

				const content = document.createElement('div');
				content.className = 'message-content';
				content.textContent = text;
				content.style.background = type === 'error' ? '#fee2e2' : type === 'warning' ? '#fef3c7' : '#f1f5f9';
				content.style.color = type === 'error' ? '#991b1b' : type === 'warning' ? '#92400e' : '#475569';
				content.style.border = type === 'error' ? '1px solid #fecaca' : type === 'warning' ? '1px solid #fde68a' : '1px solid #e2e8f0';
				content.style.maxWidth = '100%';
				content.style.textAlign = 'center';
				content.style.fontWeight = '500';

				messageWrapper.appendChild(header);
				messageWrapper.appendChild(content);
				messageDiv.appendChild(messageWrapper);
				messagesContainer.appendChild(messageDiv);
				messagesContainer.scrollTop = messagesContainer.scrollHeight;
			}

			// Update status
			function updateStatus(status, text) {
				statusIndicator.className = `status-indicator ${status}`;
				statusText.textContent = text;
			}

			// Event listeners
			voiceCard.addEventListener('click', () => {
				initiateCall('websocket');
			});

			chatCard.addEventListener('click', () => {
				initiateCall('message');
			});

			sendButton.addEventListener('click', sendMessage);
			messageInput.addEventListener('keypress', (e) => {
				if (e.key === 'Enter') {
					sendMessage();
				}
			});
		</script>
	</body>
</html>
